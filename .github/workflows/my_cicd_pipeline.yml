name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running Docker test validation..."
          # Example: list Docker images (can replace with actual tests)
          docker images
