name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Initializing environment: test"
          # Add any environment-specific setup commands here

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example Docker test command—replace or expand as needed!
          docker --version
          # Test if Dockerfile exists
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image echo "Docker image runs successfully."
          else
            echo "No Dockerfile found."
            exit 1
