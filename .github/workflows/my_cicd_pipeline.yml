name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment for $ENVIRONMENT"
          # Setup any required environment variables or configuration here

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Replace the following with your actual Docker test commands, e.g.:
          docker --version
          docker build -t my-app .
          docker run --rm my-app
