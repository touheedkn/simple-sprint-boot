name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Insert docker test commands here, e.g.,
          docker --version || echo "Docker not installed"
          # Example test, adjust to your needs. Replace 'my-image:latest' with your image name if required
          # docker run --rm my-image:latest test
