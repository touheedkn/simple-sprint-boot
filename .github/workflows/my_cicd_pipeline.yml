name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing in environment: $ENVIRONMENT"
      
      - name: Validate Docker Image
        run: |
          echo "Running docker test validation for type: docker_test"
          # Example docker build and test (customize as needed)
          docker build -t test-image .
          docker run --rm test-image
