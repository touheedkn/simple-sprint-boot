name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Docker Image Validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Setting up test environment"
          # Example: set environment variable or create files for 'test' environment
          export ENVIRONMENT=test

      - name: Validate Docker Image
        run: |
          echo "Running docker tests"
          # Check if Docker is installed
          docker --version
          # Optionally run a basic docker test (can customize this!)
          echo "FROM alpine:latest\nCMD echo Hello, CI" > Dockerfile
          docker build -t test-image .
          docker run --rm test-image
