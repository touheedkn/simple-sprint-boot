name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation test"
          docker --version
          # Example test: build and run a test container
          docker build -t test-image .
          docker run --rm test-image
