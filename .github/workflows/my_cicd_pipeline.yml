name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize (setup test environment)
        run: |
          echo "Setting up environment: test"
          export ENVIRONMENT="test"

      - name: Validate Docker image
        run: |
          echo "Validating docker image (docker_test)"
          # Example docker test: listing images (replace with actual tests as needed)
          docker info
