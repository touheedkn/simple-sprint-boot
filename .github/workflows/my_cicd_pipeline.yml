name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type 'docker_test'"
          docker --version
          # Add Docker image test commands as appropriate, e.g.:
          # docker build -t test-image .
          # docker run --rm test-image
