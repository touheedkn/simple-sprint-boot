name: NexOps Development CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

env:
  IMAGE_TAG: ${{ github.ref_name }}-${{ github.run_id }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG environment variable
        run: echo "IMAGE_TAG=${{ env.IMAGE_TAG }}" >> $GITHUB_ENV

      - name: Build application
        run: |
          echo "Building application..."
          docker build -t nexops:${IMAGE_TAG} .

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG environment variable
        run: echo "IMAGE_TAG=${{ github.ref_name }}-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Run tests
        run: |
          echo "Running tests..."
          ./run-tests.sh

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref_name == 'main' || github.ref_name == 'master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG environment variable
        run: echo "IMAGE_TAG=${{ github.ref_name }}-${{ github.run_id }}" >> $GITHUB_ENV

      - name: Deploy application
        run: |
          echo "Deploying application..."
          ./deploy.sh
