name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image in $ENVIRONMENT environment"
          # Example: build and test a Docker image
          docker build -t test-image .
          docker run --rm test-image /bin/sh -c "echo Docker test passed"
