name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: test"
          # Set up any test-specific environment variables
          echo "ENVIRONMENT=test" >> $GITHUB_ENV

      - name: Docker Image Validation
        run: |
          echo "Validating Docker image..."
          # Example: build and test the Docker image
          docker build -t test-image .
          docker run --rm test-image /bin/sh -c "echo 'Docker Test Successful'"
