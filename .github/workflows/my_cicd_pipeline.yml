name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up test environment..."
          export ENVIRONMENT=${ENVIRONMENT}

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for testing..."
          if [ "${{ env.ENVIRONMENT }}" != "test" ]; then
            echo "Error: Environment not set to test!"
            exit 1
          fi
          # Replace the following with your Docker test logic
          docker --version
          echo "Docker image test complete."
