name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment for $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker image validation"
          # Example: build and test docker image (designer may replace with real commands)
          docker build -t test-image .
          docker run --rm test-image
