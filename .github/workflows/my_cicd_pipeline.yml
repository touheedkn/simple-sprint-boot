name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running Docker image test validation"
          # Replace the following with your actual Docker test commands
          docker --version
          echo "Type of validation: docker_test"
