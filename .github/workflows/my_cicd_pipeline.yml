name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    name: Docker Image Validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: |
          echo "Initializing test environment: test"
          # Set environment variables, prepare test context, etc.
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example: Build and test a Docker image
          docker build -t test-image .
          docker run --rm test-image /bin/sh -c "echo Docker image test successful!"
