name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Starting Docker image validation of type: docker_test"
          # Place your Docker validation script/commands here
          # For example, if using a Dockerfile:
          docker build -t test-image .
          docker run --rm test-image
