      - name: Set up environment
        run: |
          echo "Setting up environment: test"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Place your Docker image test commands here, e.g.:
          docker --version
          # Example: Run a sample docker container (replace with your image/test as needed)
          docker run hello-world
