name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for test environment..."
          # The following is a basic test for Docker image validation.
          # Replace with real docker image name as required.
          docker --version
          # Pull and test a sample docker image (hello-world)
          docker pull hello-world
          docker run --rm hello-world
