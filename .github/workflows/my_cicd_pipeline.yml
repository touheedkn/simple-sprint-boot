name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up environment: test"
          export ENVIRONMENT="test"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: List available Docker images
          docker images
          # If you had a script or image to check, insert proper validation here
