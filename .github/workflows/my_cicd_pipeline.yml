name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    description: "A simple test pipeline for Docker image validation"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Setting up test environment"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Running Docker image tests"
          # Replace the below with your actual docker testing command
          docker --version
