name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation"
          # Example Docker image test commands
          docker --version
          if [ -f Dockerfile ]; then
            docker build --tag=docker-test-image .
            docker run --rm docker-test-image
          else
            echo "No Dockerfile found. Skipping build and run."
