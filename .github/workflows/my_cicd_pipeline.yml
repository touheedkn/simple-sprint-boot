name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment for $ENVIRONMENT"
      
      - name: Validate Docker Image
        run: |
          echo "Validating Docker image..."
          docker --version
          # Pull image for test (replace image_name:tag with your test image)
          docker pull image_name:tag
          # Run container to test basic functionality
          docker run --rm image_name:tag echo "Docker image test successful"