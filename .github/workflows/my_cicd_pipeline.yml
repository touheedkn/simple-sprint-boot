name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize
        uses: actions/setup-environment@v2
        with:
          environment: test

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for test environment"
          docker --version
          # Here you would run your docker image testing logic.
          # For demonstration, let's assume you want to run a simple test container.
          docker pull hello-world
          docker run hello-world
