name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Starting Docker image validation as docker_test"
          docker --version
          if docker image ls | grep -q 'test'; then
            echo "Docker image 'test' exists."
          else
            echo "Docker image 'test' not found!" >&2
            exit 1
          fi
