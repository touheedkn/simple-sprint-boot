name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker image validation tests..."
          # Example: Ensure Docker is installed
          docker --version
          # Example: Validate Dockerfile syntax
          docker image build --file Dockerfile --tag test-image .
          echo "Docker image built successfully for testing."
