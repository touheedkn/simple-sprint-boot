name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker_test validation"
          # Example: run 'docker images' or similar Docker test command
          docker --version
          docker images
