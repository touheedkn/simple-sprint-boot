name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile code
        run: |
          echo "Compiling code..."
          gcc -o myapp main.c

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: myapp
          path: myapp

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      - name: Make artifact executable
        run: chmod +x myapp

      - name: Run tests
        run: |
          echo "Running tests..."
          ./test_runner.sh

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: myapp

      - name: Make artifact executable
        run: chmod +x myapp

      - name: Deploy application
        run: |
          echo "Deploying application..."
          ./deploy.sh
