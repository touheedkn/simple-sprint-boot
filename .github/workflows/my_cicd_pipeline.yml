name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize - Set environment
        run: echo "Running in $ENVIRONMENT environment"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          docker --version
          # You can expand this with actual docker test commands if needed
