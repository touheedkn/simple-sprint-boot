name: Test Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for type: docker_test"
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image
            echo "Docker image built and ran successfully."
          else
            echo "No Dockerfile found. Skipping docker build and test."
            exit 1
          fi
