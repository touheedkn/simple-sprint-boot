name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example docker test: pull and run hello-world image
          docker --version
          docker pull hello-world
          docker run hello-world
