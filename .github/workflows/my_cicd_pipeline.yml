name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Validate Docker Image
        run: |
          echo "Running Docker image validation..."
          docker version
          # Replace 'your-image:tag' with the actual image to test
          docker pull your-image:tag
          docker run --rm your-image:tag
