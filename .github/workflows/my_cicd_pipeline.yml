name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Setting up environment: test"
          # Here you can export environment vars or set config as needed
          export ENVIRONMENT=test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example: running a test Docker command
          docker --version
          # Add your Docker image validation steps here
