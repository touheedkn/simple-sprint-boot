name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize (setup test environment)
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate (docker_test)
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example Docker validation command
          docker --version
