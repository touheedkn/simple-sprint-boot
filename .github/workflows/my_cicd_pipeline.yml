name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Starting Docker image validation..."
          docker --version
          # Depending on your workflow, run custom commands here:
          # e.g. docker build -t test-image .
          # docker run --rm test-image
          echo "Type of validation: docker_test"
