name: Test Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation test..."
          docker --version
          # Replace 'your-image-name:latest' with your actual image/tag
          docker pull your-image-name:latest
          docker run --rm your-image-name:latest echo "Container up and functional!"
