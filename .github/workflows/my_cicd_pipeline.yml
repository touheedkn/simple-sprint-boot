name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize - Set up test environment
        run: echo "Initializing environment: $ENVIRONMENT"
      
      - name: Validate - Docker image test
        uses: docker://alpine:latest
        with:
          args: echo "Running docker test validation"
