name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image in test environment"
          # Example Docker test: list images (replace this with actual validation logic)
          docker --version
          docker images
