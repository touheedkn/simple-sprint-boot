name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run static code analysis
        run: npm run lint

      - name: Execute unit tests
        run: npm test

      - name: Build application artifact
        run: npm run build

      - name: Deploy to staging environment
        env:
          STAGING_DEPLOY_URL: ${{ secrets.STAGING_DEPLOY_URL }}
          STAGING_API_KEY: ${{ secrets.STAGING_API_KEY }}
        run: |
          # Example deploy command - replace with real deploy logic
          echo "Deploying to staging at $STAGING_DEPLOY_URL"
          # curl -X POST -H "Authorization: Bearer $STAGING_API_KEY" $STAGING_DEPLOY_URL -d @./build/artifact.zip

      - name: Run integration tests
        env:
          STAGING_API_URL: ${{ secrets.STAGING_API_URL }}
        run: npm run test:integration

      - name: Deploy to production environment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          PRODUCTION_DEPLOY_URL: ${{ secrets.PRODUCTION_DEPLOY_URL }}
          PRODUCTION_API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
        run: |
          # Example production deploy command - replace with real deploy logic
          echo "Deploying to production at $PRODUCTION_DEPLOY_URL"
          # curl -X POST -H "Authorization: Bearer $PRODUCTION_API_KEY" $PRODUCTION_DEPLOY_URL -d @./build/artifact.zip
