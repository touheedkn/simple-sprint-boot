name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize - Setup Environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate - Docker Image Test
        run: |
          echo "Running Docker image validation of type: docker_test"
          # Example: Ensure Docker is installed
          docker --version
          # Place your docker test logic here (e.g., build/test/run)
          # For demonstration, we run a Docker hello-world image
          docker run hello-world
