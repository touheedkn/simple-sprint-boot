name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"
          # You can add additional setup steps here if needed

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # You can place your docker test commands below
          docker --version
          # Example: docker build -t my-image:latest .
          # Example: docker run --rm my-image:latest
