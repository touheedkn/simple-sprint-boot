name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pipeline:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: test"
          # export or set environment variables as needed
          export ENVIRONMENT="test"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: Build and test Docker image
          docker version
          docker build -t test-image .
          docker run --rm test-image /bin/sh -c "echo 'Docker image test successful'"
