name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment"
        env:
          ENVIRONMENT: test

      - name: Validate Docker image
        run: |
          echo "Checking Docker image for tests"
          docker --version
          # Run test commands here. For example, a basic Docker container test:
          docker run --rm hello-world
