name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-lint-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build
        run: |
          echo "Building the project..."
          make build

      - name: Test
        run: |
          echo "Running tests..."
          make test

      - name: Lint
        run: |
          echo "Linting the code..."
          make lint

      - name: Deploy
        run: |
          echo "Deploying application..."
          make deploy
