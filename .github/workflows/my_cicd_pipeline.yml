name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example validation, adjust as needed:
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image
          else
            echo "Dockerfile not found, skipping Docker validation."
            exit 1
