name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    description: A simple test pipeline for Docker image validation
    steps:
      - name: Initialize
        uses: actions/setup-env@v2
        with:
          environment: test

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation..."
          # Example docker command for test validation
          docker build -t test-image .
          docker run --rm test-image
