name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example docker test; replace with actual validation if needed
          docker --version || { echo "Docker is not installed"; exit 1; }
