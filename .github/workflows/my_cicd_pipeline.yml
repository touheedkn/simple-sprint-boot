name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment (test)
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Performing docker image validation (type: docker_test)"
          # Example: basic Docker image validation
          docker --version
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            echo "Docker image built successfully."
          else
            echo "Dockerfile not found!"
            exit 1
