name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Docker Image Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: test"
          # Add any environment-specific setup commands here
        env:
          ENVIRONMENT: test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example Docker validation
          docker --version
          # You can add more docker build/test commands here
        env:
          VALIDATION_TYPE: docker_test
