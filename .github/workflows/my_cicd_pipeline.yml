name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"
          # Add any setup logic needed for 'test' environment here

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example: Build docker image
          docker build -t my-test-image .
          # Example: Run basic container validation
          docker run --rm my-test-image echo "Container is running"
          # Optionally add further checks or test commands
