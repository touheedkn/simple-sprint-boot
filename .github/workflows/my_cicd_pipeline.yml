name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up environment: test"
          export ENVIRONMENT=test

      - name: Validate Docker image
        run: |
          echo "Running Docker test validation"
          # Example docker test, replace with your actual docker validation logic
          docker --version
