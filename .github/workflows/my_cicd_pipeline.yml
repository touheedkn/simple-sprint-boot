name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation test"
          # Example: Pull a test Docker image and run basic validation
          docker pull hello-world
          docker run --rm hello-world
