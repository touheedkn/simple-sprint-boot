name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example: Try to build and test a Docker image
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image echo "Docker image test successful"
          else
            echo "No Dockerfile found! Skipping Docker test."
            exit 1
