name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Place your Docker validation/test commands here
          # Example:
          docker --version
          # If you want to run a test container:
          # docker run --rm hello-world
