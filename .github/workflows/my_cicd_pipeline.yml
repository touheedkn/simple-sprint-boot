name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test-job:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Setting environment to $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation test"
          docker version
          # You can replace the below command with an actual docker test, e.g., running an image or executing test scripts
          # docker run --rm my-image:latest test
