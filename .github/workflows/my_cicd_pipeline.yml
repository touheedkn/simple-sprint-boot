name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    description: A simple test pipeline for Docker image validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: echo "Initializing environment: test"

      - name: Validate Docker image
        run: |
          echo "Performing docker_test validation..."
          # Example test: list docker images and check status
          docker --version
          docker image ls
