name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: test"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image..."
          docker --version
          # Example: try to build and run a test container (customizable as needed)
          docker build -t test-image .
          docker run --rm test-image
