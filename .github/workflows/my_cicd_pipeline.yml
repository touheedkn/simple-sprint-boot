name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test_pipeline:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example Docker test: build and run container
          docker build -t test-image .
          docker run --rm test-image
