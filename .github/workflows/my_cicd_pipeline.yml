name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for docker_test type"
          # Example: make sure Docker is installed
          docker --version
          # Example: Test building Docker image (assumes Dockerfile in repo root)
          docker build -t test-image .
          # Example: Run a simple test container
          docker run --rm test-image echo "Container ran successfully"
