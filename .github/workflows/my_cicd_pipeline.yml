name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Setting environment to $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for test purposes"
          # Insert docker test commands here, e.g.:
          if docker --version > /dev/null 2>&1; then
            echo "Docker is installed."
          else
            echo "Docker is not installed." && exit 1
          fi
          # Example check - list Docker images
          docker images || echo "No Docker images found."
