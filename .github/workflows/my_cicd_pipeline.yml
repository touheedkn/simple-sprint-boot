name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up environment: test"
          export ENVIRONMENT=test

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation"
          docker --version
          # Example test: List Docker images as a check
          docker images
