name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker tests (type: docker_test)"
          # Example docker test command
          docker --version
