name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test_pipeline:
    runs-on: ubuntu-latest
    name: Docker Image Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Checking docker image test"
          # Example validation command - replace with your actual tests
          docker --version
          echo "Docker image validation complete."