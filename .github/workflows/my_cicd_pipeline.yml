name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment for ${ENVIRONMENT}"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image..."
          docker --version
          # Example docker test, replace with your image name/tag as needed
          docker image ls
