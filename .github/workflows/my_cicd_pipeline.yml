name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating docker image with type: docker_test"
          # Example docker validation step
          docker --version
          # Add your docker test commands here
        shell: bash
