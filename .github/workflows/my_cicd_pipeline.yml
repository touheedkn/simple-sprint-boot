name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Setting up environment: test"
          # (Optionally, export variables or source env setup)
        env:
          ENVIRONMENT: test

      - name: Validate Docker image
        run: |
          echo "Running Docker test validation"
          # Example of pulling a test Docker image (adapt as needed)
          docker pull hello-world:latest
          # Example of running a Docker test (adapt as needed)
          docker run --rm hello-world
