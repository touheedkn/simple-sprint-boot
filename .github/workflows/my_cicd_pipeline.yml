name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Docker Image Validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: test"
          # Set up environment variables, folders, etc. as needed
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example: Build and test a Docker image
          docker build -t test-image .
          docker run --rm test-image
        env:
          VALIDATION_TYPE: docker_test
