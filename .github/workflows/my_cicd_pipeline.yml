name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Performing Docker image validation"
          docker --version
          # Example docker test: try to build any Dockerfile at repository root
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            echo "Docker image built successfully"
          else
            echo "No Dockerfile found, skipping docker build validation"
          fi
