name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up test environment"
          export TEST_ENVIRONMENT=test

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation test"
          # Example Docker test: try to build and run a container
          docker build -t sample-test-image .
          docker run --rm sample-test-image
