name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize (Set up test environment)
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate (Docker image test)
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example Docker test command
          docker version
