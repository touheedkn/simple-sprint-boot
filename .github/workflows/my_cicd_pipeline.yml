name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment for test"
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type=docker_test)..."
          docker images
          # Add your actual docker test/validation logic below
          # Example: docker run --rm my-image:test
