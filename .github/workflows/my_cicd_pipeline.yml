name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for test environment"
          if [ "${{ env.ENVIRONMENT }}" = "test" ]; then
            docker version
            docker info
            # Add more docker validation as needed
          else
            echo "Unexpected environment for docker image validation."
            exit 1
