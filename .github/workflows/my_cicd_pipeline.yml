name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  ENVIRONMENT: test

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example: Build and test Docker image
          docker build -t test-image .
          docker run --rm test-image
