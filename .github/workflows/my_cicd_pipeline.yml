name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running docker image tests"
          # If your repo contains a Dockerfile, build and test.
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image sh -c 'echo "Docker image test successful"'
          else
            echo "No Dockerfile found, skipping docker image validation"
          fi
