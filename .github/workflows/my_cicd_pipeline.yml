name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker_image_test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: build and test the Docker image
          docker build -t my_image:test .
          docker run --rm my_image:test echo "Docker image test run successful"
