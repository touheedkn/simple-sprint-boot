name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize
        run: |
          echo "Initializing environment: $ENVIRONMENT"
          # Add any other initialization logic needed for the test environment

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example validation: build and test Docker image
          docker build -t test-image .
          docker run --rm test-image echo "Docker image is working"
