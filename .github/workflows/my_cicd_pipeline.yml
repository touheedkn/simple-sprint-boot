name: Test Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing test environment"
          # Set up environment for 'test'
          export ENVIRONMENT=test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (docker_test)"
          # Example: list images, check Docker daemon
          docker version
          docker images
          # Add your docker tests here
