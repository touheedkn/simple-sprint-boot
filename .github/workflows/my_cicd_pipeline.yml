name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compile source code
        run: |
          echo "Compiling source code..."
          gcc main.c -o app

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare build artifact
        run: |
          echo "Compiling source code..."
          gcc main.c -o app

      - name: Run tests
        run: |
          echo "Running tests..."
          ./test_suite.sh

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare build artifact
        run: |
          echo "Compiling source code..."
          gcc main.c -o app

      - name: Run tests
        run: |
          echo "Running tests..."
          ./test_suite.sh

      - name: Deploy application
        run: |
          echo "Deploying application..."
          ./deploy.sh
