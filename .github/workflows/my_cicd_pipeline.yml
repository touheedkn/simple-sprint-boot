name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"
      
      - name: Validate Docker Image
        run: |
          echo "Validating Docker image..."
          docker --version
          # Example docker test command, replace with actual validation steps as required
          docker ps
