name: Test Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Replace with actual docker image testing commands, e.g.:
          docker --version
          # Example test: List images (no op in most CI unless images previously built)
          docker images
