name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-pipeline:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: test"
          # Set up 'test' environment, export variables as needed
          export ENVIRONMENT=test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: build and test a Docker image
          docker --version
          docker build -t test-image .
          docker run --rm test-image
