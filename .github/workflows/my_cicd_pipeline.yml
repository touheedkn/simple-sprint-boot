name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize - Setup Environment
        run: |
          echo "Setting up test environment..."
          echo "ENVIRONMENT=${ENVIRONMENT}" >> $GITHUB_ENV

      - name: Validate - Docker Image Test
        uses: docker://alpine:latest
        with:
          args: |
            sh -c "echo 'Running docker image tests of type: docker_test' && exit 0"
