name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize - Set up test environment
        run: |
          echo "Setting up environment: $ENVIRONMENT"

      - name: Validate - Docker image test
        run: |
          echo "Validating Docker image..."
          # Example: pulls any test docker image and runs a test container
          docker pull hello-world
          docker run --rm hello-world
