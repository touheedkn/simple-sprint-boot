name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker image validation checks..."
          # Example command for validation; replace this with actual checks as needed
          docker --version
          echo "Type of check: docker_test"
