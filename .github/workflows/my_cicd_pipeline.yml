name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-validation:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize (Setup environment: test)
        run: |
          echo "Initializing environment: test"
          # Set up environment variable for test
          echo "ENVIRONMENT=test" >> $GITHUB_ENV

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example placeholder: list docker images and ensure Docker is available
          docker --version
          docker image ls
