name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        env:
          ENVIRONMENT: test
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker image tests..."
          # Example: run tests inside a Docker container
          docker build -t test-image .
          docker run --rm test-image /bin/sh -c "echo Docker image test successful!"
