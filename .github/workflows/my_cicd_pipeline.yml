name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        run: |
          echo "Initializing environment: test"
          # Set up any required environment variables for testing
          export ENVIRONMENT=test

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Docker Test Validation
        run: |
          echo "Running docker test validation..."
          # Example Docker test step
          docker --version
          # You can add docker build, run, and test commands here
          # For demonstration, let's validate a simple build
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            echo "Docker image built successfully."
          else
            echo "No Dockerfile found, skipping build."
          fi
