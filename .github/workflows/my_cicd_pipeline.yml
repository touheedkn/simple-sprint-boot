name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Initializing environment: test"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image echo "Docker image is valid."
          else
            echo "No Dockerfile found. Failing workflow."
            exit 1
          fi
