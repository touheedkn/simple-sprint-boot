name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize - Set Up Test Environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Starting Docker image validation test..."
          docker --version
          # Place Docker test logic here, for example:
          docker build -t test-image .
          docker run --rm test-image
