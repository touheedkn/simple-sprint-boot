name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Docker Image Validation
        run: |
          echo "Validating Docker image..."
          docker --version
          # Example: Run a test container (replace 'my-image' as needed)
          docker pull my-image:latest
          docker run --rm my-image:latest echo "Docker image test passed"
