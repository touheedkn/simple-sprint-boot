name: Test Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize
        run: |
          echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image test"
          docker --version
          # Replace below with actual Docker image test as needed
          docker pull hello-world
          docker run hello-world
