name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    description: A simple test pipeline for Docker image validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Initializing environment: test"
          # Example: export variables or create config files as needed
          export ENVIRONMENT=test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example docker test command
          docker --version
          # Replace the following with your actual docker test logic
          docker image ls
