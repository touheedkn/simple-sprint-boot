name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Compile source code
        run: npm run build

  test:
    runs-on: ubuntu-latest
    name: Test
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Run automated tests
        run: npm test

  package:
    runs-on: ubuntu-latest
    name: Package
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Install dependencies
        run: npm install

      - name: Bundle the build artifacts
        run: npm run package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: packaged-artifacts
          path: ./dist

  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    needs: package
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: packaged-artifacts
          path: ./dist

      - name: Upload package to production environment
        env:
          PROD_DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        run: |
          echo "Deploying to production..."
          # Example deployment command:
          # scp -i $PROD_DEPLOY_KEY ./dist/* user@production-server:/path/to/deploy

  notify:
    runs-on: ubuntu-latest
    name: Notify
    needs: deploy
    steps:
      - name: Send deployment notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "text": "Deployment to production was successful! :rocket:"
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
