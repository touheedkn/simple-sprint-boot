name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    description: A simple test pipeline for Docker image validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: Pull and test the Docker image
          docker pull myapp:latest
          docker run --rm myapp:latest test
