name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application artifacts
        run: npm run build
        env:
          NODE_ENV: production

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to test environment
        run: |
          echo "Deploying to test environment..."
          # Add deployment script or commands here

      - name: Run integration tests
        run: npm run test:integration

      - name: Run security scans
        uses: github/codeql-action/analyze@v3

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy-production.outputs.environment_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Manual approval
        uses: peter-evans/wait-for-approval@v2
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          timeout-minutes: 30

      - name: Deploy to production environment
        id: deploy-production
        run: |
          echo "Deploying to production..."
          # Add production deployment script here
          echo "environment_url=https://your-production-url.example.com" >> $GITHUB_OUTPUT

      - name: Smoke tests
        run: npm run test:smoke

  notify:
    name: Notify Team
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always()
    steps:
      - name: Send status notifications to team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: CI/CD Pipeline Summary - ${{ github.repository }}
          to: team@example.com
          from: ci-cd@example.com
          html_body: |
            <h2>CI/CD Pipeline Summary</h2>
            <ul>
              <li><b>Build:</b> ${{ needs.build.result }}</li>
              <li><b>Test:</b> ${{ needs.test.result }}</li>
              <li><b>Deploy:</b> ${{ needs.deploy.result }}</li>
            </ul>
            <p>See full logs on <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">GitHub Actions</a>.</p>
