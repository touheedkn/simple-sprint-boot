name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-validation:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: test"
          # Set up any environment variables or configs for 'test' environment here
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Validating docker image with type: docker_test"
          # Example validation: build and test the Docker image
          docker build -t test-image .
          docker run --rm test-image
        env:
          VALIDATION_TYPE: docker_test
