name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: test"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image..."
          docker version
          # Example test: list images (replace with real tests as needed)
          docker images
