name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    description: A simple test pipeline for Docker image validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: echo "Initializing test environment"
        env:
          ENVIRONMENT: test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image..."
          # Replace with actual docker test commands, e.g.:
          docker --version
          docker image ls
          echo "Docker test for type: docker_test"
        env:
          TEST_TYPE: docker_test
