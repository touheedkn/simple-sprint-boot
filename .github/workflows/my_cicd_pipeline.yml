name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-testing:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running Docker image tests"
          # You may replace this with actual Docker validation logic:
          docker --version
          echo "Docker test type: docker_test"
