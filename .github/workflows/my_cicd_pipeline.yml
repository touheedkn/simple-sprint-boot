name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for type: docker_test"
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            echo "Docker build succeeded."
          else
            echo "Dockerfile not found!"
            exit 1
          fi
