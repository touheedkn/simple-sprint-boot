name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment '${ENVIRONMENT}'"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          docker --version
          # Insert your actual Docker image validation commands below
          # For example:
          # docker build -t my-test-image .
          # docker run --rm my-test-image
