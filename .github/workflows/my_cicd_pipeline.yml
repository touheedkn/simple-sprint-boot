name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up test environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image..."
          # Replace with your actual docker test command, e.g.:
          docker build -t my-app:latest .
          docker run --rm my-app:latest
