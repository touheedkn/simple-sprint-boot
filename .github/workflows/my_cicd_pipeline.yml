name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up test environment
        run: echo "Setting environment to test"
        env:
          ENVIRONMENT: test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Add your Docker image validation commands here, e.g.:
          docker --version
