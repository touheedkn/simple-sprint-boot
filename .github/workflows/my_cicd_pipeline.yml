name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  DOCKER_IMAGE_NAME: my-app
  DOCKER_REGISTRY: ghcr.io/${{ github.repository }}
  STAGING_ENV_URL: ${{ secrets.STAGING_ENV_URL }}
  PRODUCTION_ENV_URL: ${{ secrets.PRODUCTION_ENV_URL }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8 linting
        run: |
          pip install flake8
          flake8 .

      - name: Run unit tests with pytest
        run: |
          pip install pytest
          pytest

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_REGISTRY:$GITHUB_SHA .

      - name: Push Docker image to registry
        run: |
          docker push $DOCKER_REGISTRY:$GITHUB_SHA

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to staging environment
        env:
          STAGING_ENV_URL: ${{ env.STAGING_ENV_URL }}
        run: |
          echo "Deploying Docker image to staging at $STAGING_ENV_URL"
          # Insert real deployment command here, e.g. kubectl, ssh, or cloud CLI

      - name: Run integration tests
        run: |
          echo "Running integration tests against staging environment"
          # Insert real integration test commands here

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to production environment
        env:
          PRODUCTION_ENV_URL: ${{ env.PRODUCTION_ENV_URL }}
        run: |
          echo "Deploying Docker image to production at $PRODUCTION_ENV_URL"
          # Insert real deployment command here, e.g. kubectl, ssh, or cloud CLI
