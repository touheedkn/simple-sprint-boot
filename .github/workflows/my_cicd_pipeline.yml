name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Make
        uses: jcbhmr/setup-make@v3

      - name: Compile the application
        run: |
          echo "Compiling the application..."
          make

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Make
        uses: jcbhmr/setup-make@v3

      - name: Run tests
        run: |
          echo "Running tests..."
          make test

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Make
        uses: jcbhmr/setup-make@v3

      - name: Deploy to production
        run: |
          echo "Deploying to production..."
          make deploy
