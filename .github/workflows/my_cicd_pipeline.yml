name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize
        uses: actions/checkout@v4

      - name: Set up environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker tests..."
          # Example docker test; replace 'your-image:latest' & test command as needed
          docker pull your-image:latest
          docker run --rm your-image:latest /bin/sh -c "echo 'Docker image test for type: docker_test'"
