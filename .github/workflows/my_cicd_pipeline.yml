name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Setting up test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation steps."
          # Example Docker command; replace with your actual test.
          docker --version
