name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Initialize - Setup Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate - Docker Image Test
        run: |
          echo "Validating Docker image for test..."
          docker --version
          # Example docker test commands
          docker build -t test-image .
          docker run --rm test-image
