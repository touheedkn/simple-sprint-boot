name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint code
        run: npm run lint

      - name: Build application
        run: npm run build

  test:
    name: Test Stage
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Deploy to test environment
        run: npm run deploy:test

      - name: Run integration tests
        run: npm run test:integration

      - name: Run end-to-end tests
        run: npm run test:e2e

  deploy:
    name: Deploy Stage
    runs-on: ubuntu-latest
    needs: test

    environment:
      name: production
      url: ${{ steps.deploy-production.outputs.url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Await manual approval to deploy to production
        uses: peter-evans/manual-approval@v4
        with:
          timeout-minutes: 60

      - name: Deploy to production
        id: deploy-production
        run: |
          npm run deploy:prod
          echo "url=https://your-production-url.example.com" >> $GITHUB_OUTPUT

      - name: Run smoke tests
        run: npm run test:smoke

  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [build, test, deploy]
    if: always()

    steps:
      - name: Send status to Slack channel
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Workflow *${{ github.workflow }}* in *${{ github.repository }}* has completed. :white_check_mark: Build: ${{ needs.build.result }}, :microscope: Test: ${{ needs.test.result }}, :rocket: Deploy: ${{ needs.deploy.result }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send failure notification email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "GitHub Actions CI/CD Pipeline Failed"
          to: ${{ secrets.NOTIFY_EMAIL }}
          from: "no-reply@github.com"
          body: |
            The CI/CD pipeline for ${{ github.repository }} has failed.
            Please check the workflow run at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
