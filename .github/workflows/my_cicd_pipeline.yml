name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example validation: check that Docker is available
          docker --version
          # Optionally, run basic docker image tests (replace with your actual image/tag)
          docker pull hello-world:latest
          docker run hello-world:latest
