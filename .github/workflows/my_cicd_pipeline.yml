name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment for test"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for docker_test"
          # Example Docker test command; replace 'my-image:latest' as necessary
          docker build -t my-image:latest .
          docker run --rm my-image:latest echo "Docker image test passed"

