name: Test Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-image-validation:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize (setup environment)
        run: |
          echo "Setting up environment: test"
          export ENVIRONMENT=test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image as type: docker_test"
          # Example check: Test that Docker is installed and running
          docker --version
          # Add your Docker tests here, for demonstration we try to list images
          docker images
