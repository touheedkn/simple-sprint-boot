name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing test environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with test type: docker_test"
          docker --version
          # Insert your docker test commands here, e.g.:
          # docker build -t test-image .
          # docker run --rm test-image
        env:
          VALIDATION_TYPE: docker_test
