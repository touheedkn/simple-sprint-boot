name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"
          # Export variables, set up test deps, etc.

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          docker --version
          # Build Docker image
          docker build -t my-app:test .
          # Run container for validation
          docker run --rm my-app:test echo "Container started successfully"
          # Add more comprehensive tests as needed
