name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io/${{ github.repository }}
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build and Test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Lint code
        run: npm run lint

      - name: Build application artifacts
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            dist/
            build/
            .next/
            out/
          if-no-files-found: ignore

  deploy:
    name: Deploy and Test Environments
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy-to-staging.outputs.deployment-url }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to registry
        run: |
          docker build -t $REGISTRY:latest .
          docker push $REGISTRY:latest

      - name: Deploy to staging environment
        id: deploy-to-staging
        run: |
          echo "Deploying to staging..."
          # Insert deployment commands here.
          STAGING_URL="https://staging.example.com"
          echo "deployment-url=${STAGING_URL}" >> $GITHUB_OUTPUT

      - name: Run integration tests
        run: npm run test:integration

      - name: Deploy to production
        if: ${{ success() }}
        run: |
          echo "Deploying to production..."
          # Insert production deployment commands here.
          echo "Production deployment completed."

      - name: Create deployment report
        id: deployment-report
        run: |
          echo "## Deployment Report" > report.md
          echo "### Staging Environment: ${{ steps.deploy-to-staging.outputs.deployment-url }}" >> report.md
          echo "### Status: ${{ job.status }}" >> report.md
        continue-on-error: true

      - name: Upload deployment report
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: report.md

      - name: Notify Slack channel
        if: always()
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "*GitHub Actions Deployment Notification*\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nStatus: ${{ job.status }}\nStaging URL: ${{ steps.deploy-to-staging.outputs.deployment-url }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ env.SLACK_WEBHOOK_URL }}
