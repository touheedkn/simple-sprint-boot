name: Test Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  validate-docker-image:
    runs-on: ubuntu-latest
    name: Docker Image Validation
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: test"
          # Here you would set up your test environment
                
      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Here you would add Docker test commands, such as:
          docker --version
          docker build -t my-image .
          docker run --rm my-image echo "Docker image test"
