name: Test Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running Docker tests"
          # If there is a Dockerfile, build it and run tests
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image
            echo "Docker image test completed"
          else
            echo "No Dockerfile found. Skipping Docker image validation."
