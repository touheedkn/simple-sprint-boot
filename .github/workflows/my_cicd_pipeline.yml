name: Test Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        run: |
          echo "Setting up environment: test"
          # Set up environment variables if needed
          export ENVIRONMENT=test

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker image
        run: |
          echo "Validating Docker image..."
          # You can replace this with actual Docker test commands.
          if docker --version; then
            echo "Docker is installed."
          else
            echo "Docker is not installed."
            exit 1
          fi
          # Example: Test build (replace with your own Dockerfile if needed)
          docker build -t test-image .
          docker images | grep test-image && echo "Docker image built successfully."
