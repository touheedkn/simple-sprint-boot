name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image (docker_test)
        run: |
          echo "Validating Docker image with type: docker_test"
          # Replace the command below with your actual Docker validation logic
          docker image ls
