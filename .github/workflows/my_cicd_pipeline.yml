name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    description: A simple test pipeline for Docker image validation

    steps:
      - name: Initialize - Setup Environment
        run: |
          echo "Initializing environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate - Docker Image Test
        uses: docker://alpine:latest
        with:
          entrypoint: /bin/sh
          args: -c "echo 'Validating Docker image type: docker_test'"
