name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running Docker image tests"
          docker --version
          # Example: build and test the Docker image
          docker build -t test-image .
          docker run --rm test-image
