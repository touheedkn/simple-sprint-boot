name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Docker Image Validation
        run: |
          echo "Running Docker image validation test"
          # Replace with your actual Docker test command
          docker --version
          # Example: docker build -t my-app .
          # Example: docker run --rm my-app
