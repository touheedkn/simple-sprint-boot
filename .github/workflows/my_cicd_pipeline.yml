name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation (type: docker_test)"
          # Insert your docker test validation commands here, e.g.:
          docker --version
          # Example test (assumes Dockerfile in root, change as needed):
          docker build -t test-image .
          docker run --rm test-image
