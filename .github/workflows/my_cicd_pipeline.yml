name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing test environment..."
          echo "Environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for testing..."
          docker info
          # Example test: attempt to build and run the image if Dockerfile exists
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image echo "Docker image test PASSED"
          else
            echo "No Dockerfile found; skipping Docker image validation."
          fi
