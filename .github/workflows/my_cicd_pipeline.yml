name: Test Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: |
          echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image: docker_test"
          # Example Docker test: build and run the image.
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image echo "Docker image validated."
          else
            echo "No Dockerfile found, skipping Docker validation."
          fi
