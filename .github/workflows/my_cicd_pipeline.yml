name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    name: Docker Image Validation
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize
        env:
          ENVIRONMENT: test
        run: |
          echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example docker validation command
          docker --version
