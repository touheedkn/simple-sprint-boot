name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker image validation test..."
          # Replace the following with your actual docker validation command
          docker --version
