name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    name: Docker Image Validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment for testing..."
          echo "Environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Running docker image tests of type: docker_test"
          # Example: run your docker image validation commands below
          # docker build -t my-image .
          # docker run --rm my-image test
        env:
          TEST_TYPE: docker_test
