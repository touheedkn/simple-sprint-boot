name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"
          # You could set up any environment variables or preparation logic here

      - name: Validate Docker image
        run: |
          echo "Validating Docker image..."
          # Example: Build the Docker image
          docker build -t test-image .
          # Example: Run a basic container test
          docker run --rm test-image echo "docker_test"
