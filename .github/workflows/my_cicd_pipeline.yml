name: Test Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-pipeline:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize - Set environment
        run: echo "Environment: ${{ env.ENVIRONMENT }}"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image..."
          docker --version
          # Example docker test command, replace with your docker test logic
          docker image ls
