name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation"
          # Example: Build Docker image and run tests
          docker build -t test-image .
          docker run --rm test-image /bin/sh -c "echo Docker test successful"
