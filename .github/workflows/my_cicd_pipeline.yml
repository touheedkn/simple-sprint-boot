name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Initializing environment: test"
        env:
          TEST_ENVIRONMENT: test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
