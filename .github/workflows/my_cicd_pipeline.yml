name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    description: A simple test pipeline for Docker image validation

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: echo "Setting up environment: test"

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation"
          # Ensure Docker is installed
          docker --version
          # Example validation: List images
          docker images
