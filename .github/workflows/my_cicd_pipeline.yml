name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment for $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation for type: docker_test"
          # Replace the command below with your actual Docker test validation
          docker --version || { echo "Docker is not installed!"; exit 1; }
