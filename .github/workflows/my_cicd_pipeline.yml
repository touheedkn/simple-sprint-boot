name: Test Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example: Build Docker image
          docker build -t test-image .
          # Example: Run a Docker container test
          docker run --rm test-image
