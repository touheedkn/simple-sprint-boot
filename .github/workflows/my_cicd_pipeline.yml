name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for test environment"
          docker version
          docker info
          # Example: Build and test if Dockerfile exists
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image
          else
            echo "No Dockerfile found to validate."
