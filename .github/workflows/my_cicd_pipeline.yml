name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Docker Image Test Validation
        run: |
          echo "Running Docker test validation"
          # Example: Build the Docker image and test it
          docker build -t test-image .
          docker run --rm test-image echo "Docker container is running correctly"
