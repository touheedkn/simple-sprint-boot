name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing test environment..."
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # You can place your Docker image testing commands here, for example:
          # docker build -t myimage .
          # docker run --rm myimage test
        env:
          TYPE: docker_test
