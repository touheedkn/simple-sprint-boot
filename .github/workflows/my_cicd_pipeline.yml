name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image test validation"
          if [ "${{ env.ENVIRONMENT }}" = "test" ]; then
            docker --version
            # Replace below with actual docker image test logic
            echo "Docker image validation: type=docker_test"
          else
            echo "Skipping Docker image test, environment is not test."
            exit 1
