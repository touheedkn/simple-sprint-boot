name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing the test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker image test validation..."
          # Assuming Dockerfile exists in the root of the repo for validation
          docker build -t test-image .
          docker run --rm test-image echo "Docker image validation succeeded"
