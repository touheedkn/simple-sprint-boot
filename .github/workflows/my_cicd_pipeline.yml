name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running Docker image validation tests..."
          # Example: build a test Docker image and run a basic test
          docker build -t test-image .
          docker run --rm test-image echo "Docker test passed"
