name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    name: Docker Image Validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize (setup environment: test)
        run: |
          echo "Initializing environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate (docker_test)
        run: |
          echo "Running docker tests (type: docker_test)"
          # Example: List Docker images (customize as needed)
          docker images
        env:
          TYPE: docker_test
