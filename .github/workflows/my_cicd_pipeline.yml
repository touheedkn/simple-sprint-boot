name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: test"
          # Add any necessary initialization here
        env:
          ENVIRONMENT: test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image using test type: docker_test"
          # Replace this with actual Docker validation commands, for example:
          docker --version
          docker build -t test-image .
          docker run --rm test-image
        env:
          VALIDATION_TYPE: docker_test
