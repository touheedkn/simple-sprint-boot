name: Test Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image using type: docker_test"
          # Example check: list Docker images (replace with real validation as needed)
          docker images || echo "No Docker images found"
