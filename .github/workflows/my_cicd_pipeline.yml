name: Test Pipeline

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  docker-image-test:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: |
          echo "Initializing test environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example: Try running the image (replace 'my-image:latest' with the actual image name)
          docker --version
          docker pull my-image:latest || exit 1
          docker run --rm my-image:latest echo "Container runs successfully"
