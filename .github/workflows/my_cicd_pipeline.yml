name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Add your Docker image validation logic here (example below)
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image
            echo "Docker image built and tested successfully."
          else
            echo "Dockerfile not found. Exiting with error."
            exit 1
