name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Setting up environment: test"
          # Any additional setup logic can go here

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example test: run a Docker build and basic test
          docker build -t my_app_test .
          docker run --rm my_app_test echo "Docker image test passed"
