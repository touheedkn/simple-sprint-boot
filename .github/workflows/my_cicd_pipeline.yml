name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    name: Docker Image Validation
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize (Setup Environment)
        run: |
          echo "Setting up environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate (Docker Image Test)
        run: |
          echo "Running Docker tests of type: docker_test"
          # Example logic for docker test validation
          docker --version || { echo "Docker is not installed"; exit 1; }
          # Put your docker test logic here, for example:
          # docker build -t test-image .
          # docker run --rm test-image some-test-command
        env:
          TEST_TYPE: docker_test
