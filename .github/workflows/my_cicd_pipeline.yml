name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"
          # You can set environment-specific setup here.

      - name: Docker Test Validation
        run: |
          echo "Running Docker image tests..."
          # Replace the following with your docker test validation commands.
          # For example:
          docker build -t test-image .
          docker run --rm test-image
