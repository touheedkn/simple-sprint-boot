name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        run: echo "Initializing test environment..."
        env:
          ENVIRONMENT: test

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation test..."
          if docker info > /dev/null 2>&1; then
            echo "Docker is running."
          else
            echo "Docker is not running." && exit 1
          fi
        env:
          VALIDATION_TYPE: docker_test
