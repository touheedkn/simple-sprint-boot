name: Test Pipeline

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running Docker image tests"
          docker version
          # Example: Run tests against your Docker image
          # Replace 'your-image:tag' and test script as needed
          docker pull your-image:tag
          docker run --rm your-image:tag docker_test
