name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example docker test command, replace with your actual validation command
          docker build -t test-image .
          docker run --rm test-image
