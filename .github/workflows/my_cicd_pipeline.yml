name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image using type: docker_test"
          # Add your Docker validation logic here, e.g.:
          docker --version
          # Example: build and test docker image
          docker build -t test-image .
          docker run --rm test-image
