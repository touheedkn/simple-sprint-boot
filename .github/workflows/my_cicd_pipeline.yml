name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  docker-image-validation:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up environment: test"
          # Here you can export environment variables or do additional setup as needed
          export TEST_ENVIRONMENT=test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example commands for docker validation
          # Ensure Docker is started (on ubuntu-latest it is)
          docker version
          # List images, as an example
          docker images
          # Optionally, run additional custom validation steps here
