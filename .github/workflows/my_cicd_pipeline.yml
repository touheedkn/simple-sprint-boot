name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating docker image for type: docker_test"
          # Example: build and test docker image
          docker build -t test-image .
          docker run --rm test-image
