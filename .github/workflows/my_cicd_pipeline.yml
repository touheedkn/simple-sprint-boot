name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Initialize
        run: |
          echo "Initializing environment: test"
          export ENVIRONMENT=test

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Test
        run: |
          echo "Validating Docker image..."
          # Example: build the Docker image for tests
          docker build -t test-image .
          # Example: run a Docker test container
          docker run --rm test-image
