name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    name: Docker Image Validation

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize - Set up test environment
        run: |
          echo "Initializing test environment"
          export ENVIRONMENT="test"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image"
          # Example Docker test command
          docker --version
          docker image ls
          # Add your validation commands here, e.g., running docker tests
