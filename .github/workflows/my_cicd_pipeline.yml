name: Test Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Replace the following with actual docker test commands as needed
          docker --version
          docker image ls
