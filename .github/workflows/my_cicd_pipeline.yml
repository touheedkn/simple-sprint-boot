name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment for $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation test"
          # Example: Test docker build
          docker build -t test-image .
          docker run --rm test-image echo "Docker image test passed"