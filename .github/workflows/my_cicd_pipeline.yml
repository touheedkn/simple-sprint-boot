name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation..."
          # Example: Test if Docker is installed
          docker --version
          # Example: Test a docker image (replace 'your-image:latest' as needed)
          docker pull your-image:latest
          docker run --rm your-image:latest /bin/sh -c "echo 'Docker image test: Success!'"