name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Starting Docker image validation..."
          # Pull or build the Docker image as required for testing
          docker build -t test-image .
          # Example validation: Check docker health, run basic tests
          docker run --rm test-image /bin/true
          echo "Docker image validation complete (type: docker_test)"
