name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Environment (test)
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Replace the following with actual docker test command as needed
          docker --version
