name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize - Setup Environment
        run: |
          echo "Initializing test environment: $ENVIRONMENT"
      
      - name: Validate - Docker Image Test
        run: |
          echo "Running Docker image tests..."
          # Example of a docker test. Adapt below as needed.
          docker --version
          # If you have a Dockerfile:
          docker build -t test-image .
          docker run --rm test-image
