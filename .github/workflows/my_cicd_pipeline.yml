name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize - Setup test environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate - Docker image test
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example Docker validation command; replace with actual test as needed
          docker version
