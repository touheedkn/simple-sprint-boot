name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    name: Docker Image Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Running Docker image tests"
          docker --version
          # Example: Test if a Docker image builds
          docker build -t test-image .
          echo "Docker image build completed for validation"
