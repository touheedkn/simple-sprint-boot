name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    description: A simple test pipeline for Docker image validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize
        env:
          ENVIRONMENT: test
        run: |
          echo "Initializing environment: $ENVIRONMENT"
          # Add any required initialization steps here

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: build and test a Docker image
          docker build -t my-image:latest .
          docker run --rm my-image:latest
