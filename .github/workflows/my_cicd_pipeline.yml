name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image..."
          # Assuming 'docker_test' means running a test container and verifying it starts
          docker build -t test-image .
          docker run --rm test-image echo "Container started successfully"
