name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: test"

      - name: Validate Docker Image
        run: |
          echo "Running Docker image validation"
          # Example Docker test, adapt as needed
          docker --version
          # Assuming a Dockerfile exists
          docker build -t test-image .
          docker run --rm test-image
