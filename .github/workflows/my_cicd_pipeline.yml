name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing in test environment"
          # Set up environment variables or pre-steps as needed
        env:
          ENVIRONMENT: ${{ env.ENVIRONMENT }}

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Add actual Docker validation logic here
        env:
          VALIDATION_TYPE: docker_test
