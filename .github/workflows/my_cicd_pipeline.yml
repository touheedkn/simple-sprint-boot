name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment (test)
        run: |
          echo "Initializing environment: $ENVIRONMENT"
      
      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # If you want to actually test a Docker image, add actual Docker validation commands here.
          docker version
          # Example: build and test docker image
          docker build -t test-image .
          docker run --rm test-image
