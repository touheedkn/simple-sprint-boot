name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker validation checks (type: docker_test)"
          # Example docker image test: listing images, info, etc.
          docker --version
          docker images
