name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"
          # Add any environment-specific setup commands here

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: Try to build and test the Docker image
          docker build -t test-image .
          docker run --rm test-image
