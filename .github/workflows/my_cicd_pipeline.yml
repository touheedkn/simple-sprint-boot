name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for type: docker_test"
          docker --version
          # Example: run Docker image tests here
          # Replace the image name and tests with your own
          docker pull ubuntu:latest
          docker run --rm ubuntu:latest echo "Docker test passed"
