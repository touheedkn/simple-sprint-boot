name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image..."
          # Replace the following with your actual test command, e.g.:
          docker build -t test-image .
          docker run --rm test-image
          echo "Docker test type: docker_test"
