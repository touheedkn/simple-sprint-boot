name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DOCKER_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build application artifacts
        run: npm run build

      - name: Run integration tests
        run: npm run test:integration

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.DOCKER_IMAGE }}

      - name: Push Docker image to registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy-staging.outputs.staging_url }}
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4

      - name: Pull Docker image from registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.DOCKER_IMAGE }}

      - name: Deploy to staging environment
        id: deploy-staging
        run: |
          # Replace the following with your actual deployment script/commands
          echo "Deploying ${{ env.DOCKER_IMAGE }} to staging environment..."
          echo "https://staging.example.com" > staging_url.txt
        continue-on-error: false

      - name: Set staging url output
        id: set-staging-url
        run: |
          url=$(cat staging_url.txt)
          echo "staging_url=$url" >> $GITHUB_OUTPUT

      - name: Run smoke tests in staging
        env:
          STAGING_URL: ${{ steps.set-staging-url.outputs.staging_url }}
        run: |
          # Replace this with your smoke test commands
          echo "Running smoke tests against $STAGING_URL"
          # Example: npm run test:smoke -- --baseUrl=$STAGING_URL

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://production.example.com
    steps:
      - name: Checkout code from repository
        uses: actions/checkout@v4

      - name: Pull Docker image from registry
        run: |
          echo ${{ secrets.GITHUB_TOKEN }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          docker pull ${{ env.DOCKER_IMAGE }}

      - name: Deploy to production environment
        run: |
          # Replace the following with your actual deployment script/commands
          echo "Deploying ${{ env.DOCKER_IMAGE }} to production environment..."
          # Example: kubectl set image deployment/my-app my-app=${{ env.DOCKER_IMAGE }}
