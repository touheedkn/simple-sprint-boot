name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"
      
      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example: Test Docker image existence and basic validation
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image echo "Docker image runs correctly"
          else
            echo "Dockerfile not found. Docker image validation failed."
            exit 1
          fi
