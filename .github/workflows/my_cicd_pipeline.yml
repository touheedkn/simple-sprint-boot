name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Build the application
        run: |
          echo "Building the application..."
          make build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: build/

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Run tests
        run: |
          echo "Running tests..."
          make test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: build/

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make

      - name: Deploy application
        run: |
          echo "Deploying application..."
          make deploy

# To trigger the deploy job manually, enable workflow_dispatch.
on:
  workflow_dispatch:
