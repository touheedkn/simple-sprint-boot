name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: |
          echo "Setting up environment: test"
          # Set up environment variables or secrets if needed
          export ENVIRONMENT=test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image for docker_test"
          # Example docker validation test
          docker --version
          # Replace with actual docker test commands below
          # e.g., docker build -t test-image .
          # docker run --rm test-image /bin/sh -c "your test"
