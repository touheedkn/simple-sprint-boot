name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment (test)
        run: |
          echo "Initializing environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation (type: docker_test)"
          # Place your docker validation commands here
        env:
          VALIDATION_TYPE: docker_test
