name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"
      
      - name: Validate Docker image
        run: |
          echo "Running Docker image validation"
          docker --version
          # Replace with actual image/tag as needed for your test
          echo "Testing Docker image..."
          docker pull hello-world
          docker run hello-world
