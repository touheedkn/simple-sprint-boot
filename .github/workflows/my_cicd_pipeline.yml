name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize (Setup environment)
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation (type: docker_test)"
          # Example: Build and test Docker image
          docker build -t test-image .
          docker run --rm test-image
