name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Setting up test environment"
          # Set up any specific environment variables
          export ENVIRONMENT=test

      - name: Validate Docker image
        run: |
          echo "Validating Docker image for type: docker_test"
          # Example: Build Docker image and run tests
          docker build -t test-image .
          docker run --rm test-image
