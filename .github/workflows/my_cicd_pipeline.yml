name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test-docker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Setting up environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Running Docker image validation"
          # Example docker test; replace 'my-image' with your image name if needed
          docker --version
          docker image ls
          # Add your actual docker test logic below (for demonstration)
          echo "Docker test type: docker_test"
