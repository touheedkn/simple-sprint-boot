name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize - Set up test environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Add your docker test commands below
          docker --version
          # Example: docker build -t my-test-image .
          # Example: docker run --rm my-test-image echo 'Test passed'
