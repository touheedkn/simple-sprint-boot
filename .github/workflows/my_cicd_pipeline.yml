name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Running Docker test validation..."
          docker --version
          # Example: Test Docker image build, replace 'Dockerfile' and 'my-image:latest' as appropriate
          docker build -t my-image:latest .
          docker run --rm my-image:latest
