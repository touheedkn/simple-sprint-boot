name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize - Set up test environment
        run: |
          echo "Setting environment to test"
          export ENVIRONMENT=test

      - name: Validate - Docker image test
        run: |
          echo "Running docker image test"
          # Example command for docker image validation
          docker --version
          # Add your test commands here, e.g.:
          # docker run --rm my-image:latest test
