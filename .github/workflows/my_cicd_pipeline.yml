name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing test environment"
          export ENVIRONMENT=test

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          docker --version
          # Example: run docker image tests below
          # docker build -t test-image .
          # docker run --rm test-image /bin/test-command
