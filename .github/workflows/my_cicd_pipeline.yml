name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize (setup environment: test)
        run: |
          echo "Setting up environment: test"
          # You may export or configure environment variables here as needed
          export ENVIRONMENT=test

      - name: Validate (docker_test)
        run: |
          echo "Validating Docker setup"
          if ! command -v docker > /dev/null; then
            echo "Docker is not installed!"
            exit 1
          fi
          echo "Running a basic Docker test..."
          docker run --rm hello-world
