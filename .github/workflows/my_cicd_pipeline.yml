name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-docker-image:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize (setup environment)
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image using docker_test"
          # Example: Build and test Docker image
          docker build -t test-image .
          docker run --rm test-image
