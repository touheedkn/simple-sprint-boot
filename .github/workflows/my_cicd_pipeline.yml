name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize test environment
        env:
          ENVIRONMENT: test
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running docker image validation tests"
          docker --version
          # Example validation command: test Docker build and run
          docker build -t test-image .
          docker run --rm test-image
