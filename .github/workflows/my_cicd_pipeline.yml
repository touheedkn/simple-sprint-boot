name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Docker image validation
        run: |
          echo "Validating Docker image..."
          # Example: Pull and test a Docker image (update this to your actual image/test commands)
          docker pull hello-world
          docker run hello-world
