name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: ${{ env.ENVIRONMENT }}"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example: Check Docker installation and run a simple test
          docker --version
          echo "Running Docker test..."
          echo -e "FROM alpine\nCMD echo Hello, Docker!" > Dockerfile
          docker build -t docker-test-image .
          docker run --rm docker-test-image
