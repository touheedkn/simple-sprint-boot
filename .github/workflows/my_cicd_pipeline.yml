name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: python:3.10-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: alpine:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deployment started
        run: echo "Deployment started"

      - name: Run deploy script
        run: ./deploy.sh

  notify:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    if: always()
    steps:
      - name: Send mail on success/failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.example.com
          server_port: 587
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: |
            Github Actions: ${{ job.status }} - ${{ github.workflow }}
          body: |
            The workflow has completed with status: ${{ job.status }}.
            Please check the build and deployment results.
          to: dev-team@example.com
          from: GitHub Actions <noreply@example.com>
        if: ${{ (success() && true) || (failure() && true) }}
