name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)..."
          if [ -f Dockerfile ]; then
            docker build -t test-image .
            docker run --rm test-image echo "Docker image test passed"
          else
            echo "No Dockerfile found!"
            exit 1
