name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example test: pull the image and run basic test commands
          docker --version
          # Replace 'your-image:latest' with the actual image name if needed
          docker pull your-image:latest || echo "Image not found, skipping pull"
          docker run --rm your-image:latest echo "Docker image test successful"
