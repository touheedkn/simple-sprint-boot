name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: $ENVIRONMENT"

      - name: Docker Image Validation
        run: |
          echo "Running docker test validation"
          docker --version
          # Replace this line with your docker test command if available
          # Example: docker run --rm myimage:test
