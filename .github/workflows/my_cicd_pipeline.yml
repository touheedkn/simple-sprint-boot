name: Test Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment for $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image validation tests"
          docker --version
          # Example: Run a sample docker test, replace with real commands as needed
          docker build -t test-image .
          docker run --rm test-image echo "Docker image test complete"
