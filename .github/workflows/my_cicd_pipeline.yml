name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize Environment (test)
        run: echo "Initializing environment: test"

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation..."
          docker --version
          # Add your docker test commands here, for example:
          docker build -t test-image .
          docker run --rm test-image
