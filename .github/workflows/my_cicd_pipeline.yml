name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Initialize - Setup Environment
        run: echo "Setting up environment: $ENVIRONMENT"

      - name: Validate - Docker Image Test
        uses: docker://alpine:latest
        with:
          entrypoint: sh
        args: -c "echo 'Running docker image validation test for type: docker_test'"
