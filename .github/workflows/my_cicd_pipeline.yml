name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing test environment"
        env:
          ENVIRONMENT: test

      - name: Docker image validation
        run: |
          echo "Validating Docker image..."
          docker build -t test-image .
          docker run --rm test-image /bin/sh -c "echo Docker test successful"
