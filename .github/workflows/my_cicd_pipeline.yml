name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-validation:
    name: Docker Image Validation
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: use docker to test an image named 'my-app:latest'
          docker --version
          docker pull my-app:latest || echo "Image not found - skipping pull"
          docker run --rm my-app:latest echo "Docker image test passed"
