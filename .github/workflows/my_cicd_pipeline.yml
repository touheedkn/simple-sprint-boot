name: Test Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Test Environment
        run: |
          echo "Initializing environment: test"

      - name: Validate Docker Image
        run: |
          echo "Running docker image validation test"
          # Example: assuming a Dockerfile is present in the repo
          docker build -t test-image .
          docker run --rm test-image echo "Docker image built and running!"
