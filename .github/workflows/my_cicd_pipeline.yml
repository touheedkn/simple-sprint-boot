name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Docker Image Validation
        run: |
          echo "Validating Docker image (type: docker_test)"
          # Example: Build and run the Docker image for testing
          docker build -t test_image .
          docker run --rm test_image
