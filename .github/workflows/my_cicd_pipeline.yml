name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-validation:
    name: Docker Image Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing test environment..."
          export ENVIRONMENT="test"
          echo "ENVIRONMENT=$ENVIRONMENT" >> $GITHUB_ENV

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Example: build the Docker image
          docker build -t test-image .
          # Example: use type parameter; in a real pipeline this might run test suite
          docker run --rm test-image /bin/sh -c "echo Running docker_test"
