name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize (setup environment: test)
        run: echo "Initializing test environment"

      - name: Validate Docker Test
        run: |
          echo "Validating Docker image..."
          # Example: Build the Docker image
          docker build -t my-image-test .
          # Example: Run container
          docker run --rm my-image-test
