name: Test Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize test environment
        run: echo "Initializing environment: test"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Add a Docker validation step (example: list Docker images)
          docker --version
          docker images
