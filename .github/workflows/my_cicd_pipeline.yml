name: Test Pipeline
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize Environment
        env:
          ENVIRONMENT: test
        run: echo "Initializing testing environment: $ENVIRONMENT"

      - name: Validate Docker Image
        run: |
          echo "Starting Docker image validation"
          # You can add your Docker image build and test commands here, for example:
          # docker build -t my-image:latest .
          # docker run --rm my-image:latest
          echo "Docker image validation type: docker_test"
