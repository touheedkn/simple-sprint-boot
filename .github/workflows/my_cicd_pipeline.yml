name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize (setup test environment)
        run: echo "Initializing test environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Running Docker image tests..."
          docker --version
          # Replace below with your actual image name, e.g. my-app:latest
          docker pull my-image:latest
          docker run --rm my-image:latest /bin/sh -c "echo Docker image is valid"
