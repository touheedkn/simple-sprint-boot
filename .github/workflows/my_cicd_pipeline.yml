name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-validation:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: echo "Initializing environment: $ENVIRONMENT"

      - name: Validate Docker image
        run: |
          echo "Validating Docker image (type: docker_test)"
          if ! docker --version >/dev/null 2>&1; then
            echo "Installing Docker..."
            sudo apt-get update
            sudo apt-get install -y docker.io
          fi
          # Example Docker test step (replace with project-specific validation)
          docker ps
