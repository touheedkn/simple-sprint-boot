name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    name: Docker Image Validation

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Initialize Environment
        run: |
          echo "Initializing environment: test"
        env:
          ENVIRONMENT: test

      - name: Validate Docker Image
        run: |
          echo "Running Docker image validation tests..."
          # Replace this with actual docker test commands as needed
          docker --version
          # Example test - list docker images
          docker images
