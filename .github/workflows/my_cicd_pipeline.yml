name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  docker-image-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing test environment: $ENVIRONMENT"
          # Add any environment setup commands needed here

      - name: Validate Docker image
        run: |
          echo "Validating Docker image with type: docker_test"
          # Add Docker image validation commands below
          # For example:
          docker --version
          docker build -t test-image .
          docker run --rm test-image
