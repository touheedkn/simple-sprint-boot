name: Test Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  docker-test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      DOCKER_TEST_TYPE: docker_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize environment
        run: |
          echo "Initializing test environment"
          echo "ENVIRONMENT=${ENVIRONMENT}"

      - name: Validate Docker Image
        run: |
          echo "Running Docker validation with type: ${DOCKER_TEST_TYPE}"
          # Example: use 'docker ps' or your validation logic here
          docker --version
