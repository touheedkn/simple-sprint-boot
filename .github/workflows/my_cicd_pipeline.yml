name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Execute unit tests
        run: npm test

      - name: Build application package
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact
          path: |
            dist/**
            build/**
            !**/node_modules/**

  deploy-staging:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./build_output

      - name: Deploy to staging environment
        env:
          STAGING_DEPLOY_URL: ${{ secrets.STAGING_DEPLOY_URL }}
          STAGING_DEPLOY_TOKEN: ${{ secrets.STAGING_DEPLOY_TOKEN }}
        run: |
          echo "Deploying to staging at $STAGING_DEPLOY_URL"
          # Add your deployment logic here, for example:
          # curl -X POST -H "Authorization: Bearer $STAGING_DEPLOY_TOKEN" -F "artifact=@build_output/your_artifact.zip" "$STAGING_DEPLOY_URL"

      - name: Run integration tests
        run: npm run test:integration

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact
          path: ./build_output

      - name: Deploy to production
        env:
          PRODUCTION_DEPLOY_URL: ${{ secrets.PRODUCTION_DEPLOY_URL }}
          PRODUCTION_DEPLOY_TOKEN: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
        run: |
          echo "Deploying to production at $PRODUCTION_DEPLOY_URL"
          # Add your deployment logic here, for example:
          # curl -X POST -H "Authorization: Bearer $PRODUCTION_DEPLOY_TOKEN" -F "artifact=@build_output/your_artifact.zip" "$PRODUCTION_DEPLOY_URL"
